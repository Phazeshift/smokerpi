name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          SMOKERPI_TEST: '1'
        run: pytest -v

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        env:
          CI: 'true'
        run: yarn test --watchAll=false

      - name: Build
        # react-scripts 3.x (webpack 4) predates OpenSSL 3's removal of the
        # legacy MD4 hash it uses internally; without this, `yarn build`
        # fails on Node 17+ with ERR_OSSL_EVP_UNSUPPORTED.
        env:
          NODE_OPTIONS: '--openssl-legacy-provider'
        run: yarn build
